[package]
name = "postgres-db"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PostgreSQL configuration, secrets, and connection management"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
] }
telemetry = { path = "../telemetry" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
url = "2"

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
