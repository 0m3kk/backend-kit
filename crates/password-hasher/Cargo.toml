[package]
name = "password-hasher"
version = "1.0.0"
edition = "2024"
description = "Core traits, types, and errors for password hashing. Algorithm implementations (argon2, bcrypt) live in separate crates."

[features]
default = ["async"]
async = ["dep:async-trait", "dep:tokio"]
noop = []

[dependencies]
async-trait = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt", "sync"], optional = true }

[dev-dependencies]
password-hasher-argon2 = { path = "../password-hasher-argon2" }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "noop_hasher_tests"
required-features = ["noop"]

[lints]
workspace = true
