[package]
name = "projection"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Projection checkpoints, view contract, and catch-up worker"
readme = "README.md"

[dependencies]
event-store = { path = "../event-store" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
] }
telemetry = { path = "../telemetry" }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
