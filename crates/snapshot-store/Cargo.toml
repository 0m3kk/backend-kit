[package]
name = "snapshot-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Snapshot store: types, trait, and PostgreSQL implementation"
readme = "README.md"

[dependencies]
async-trait = "0.1"
event-store = { path = "../event-store" }
mockall = "0.15"
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
