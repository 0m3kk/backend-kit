[package]
name = "mailer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Email service abstraction, SMTP sender, and Minijinja template rendering"
readme = "README.md"

[dependencies]
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-native-tls",
    "tracing",
] }
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
