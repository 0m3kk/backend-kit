[package]
name = "kv-store-redb"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
kv-store = { path = "../kv-store" }
redb = "4.1"
tokio = { version = "1.53", features = ["sync"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
