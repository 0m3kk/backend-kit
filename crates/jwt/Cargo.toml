[package]
name = "jwt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generic JSON Web Token (JWT) generation, verification, and configuration"
readme = "README.md"

[dependencies]
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
