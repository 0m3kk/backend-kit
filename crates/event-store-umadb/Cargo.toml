[package]
name = "event-store-umadb"
version = "1.0.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
event-sourcing = { path = "../event-sourcing" }
futures-util = "0.3"
serde_json = "1.0"
tokio = { version = "1.53", features = ["time"] }
umadb-client = "0.7"
umadb-dcb = "0.7"
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
