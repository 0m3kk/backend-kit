[package]
name = "password-policy"
version = "1.1.0"
edition = "2024"
description = "Comprehensive password policy enforcement, validation, strength estimation, and generation crate for backend-kit."

[features]
default = ["generator"]
generator = []
hibp = ["dep:async-trait", "dep:reqwest", "dep:sha1"]

[dependencies]
async-trait = { version = "0.1", optional = true }
rand = "0.10"
reqwest = { version = "0.13", features = ["json"], optional = true }
serde = { version = "1.0", features = ["derive"] }
sha1 = { version = "0.11", optional = true }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
