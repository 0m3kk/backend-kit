[package]
name = "kv-store"
version = "1.1.0"
edition = "2024"

[features]
memory = ["dep:tokio"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["sync"], optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "memory_store_tests"
required-features = ["memory"]

[lints]
workspace = true
