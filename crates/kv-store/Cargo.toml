[package]
name = "kv-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Key-value store: types, trait, and PostgreSQL implementation"
readme = "README.md"

[dependencies]
async-trait = "0.1"
mockall = "0.15"
opentelemetry = "0.33"
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "time",
] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
