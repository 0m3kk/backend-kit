[package]
name = "kv-store-redis"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
kv-store = { path = "../kv-store" }
redis = { version = "1.5", features = ["tokio-comp", "aio", "connection-manager"] }
tokio = { version = "1.53", features = ["time"] }

[dev-dependencies]
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
