[package]
name = "two-factor-auth-sms"
version = "1.1.0"
edition = "2024"
description = "SMS OTP 2FA implementation for two-factor-auth in backend-kit."

[dependencies]
async-trait = "0.1"
rand = "0.10"
secret-store = { path = "../secret-store" }
serde = { version = "1.0", features = ["derive"] }
sms-sender = { path = "../sms-sender" }
two-factor-auth = { path = "../two-factor-auth" }

[dev-dependencies]
secret-store = { path = "../secret-store", features = ["memory"] }
sms-sender = { path = "../sms-sender", features = ["memory"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
