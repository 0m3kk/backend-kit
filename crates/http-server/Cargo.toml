[package]
name = "http-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "HTTP router initialization, middleware, OpenAPI, and server configuration"
readme = "README.md"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = [
    "cookie",
    "cookie-private",
    "cookie-signed",
] }
cookie = "0.18"
opentelemetry = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "time"] }
tower-http = { version = "0.7", features = [
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "cors",
    "propagate-header",
    "request-id",
    "set-header",
    "timeout",
    "trace",
] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
utoipa = { version = "6", features = ["axum_extras", "time", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
uuid = { version = "1.27", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
