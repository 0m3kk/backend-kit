[package]
name = "secret-store"
version = "0.0.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
async-trait = "0.1"
chacha20poly1305 = "0.11"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
