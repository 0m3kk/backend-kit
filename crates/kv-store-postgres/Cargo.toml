[package]
name = "kv-store-postgres"
version = "1.2.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
kv-store = { path = "../kv-store" }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-native-tls", "macros"] }
tokio = { version = "1.53", features = ["time"] }

[dev-dependencies]
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
