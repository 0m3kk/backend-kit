[package]
name = "secret-store-postgres"
version = "0.0.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
secret-store = { path = "../secret-store" }
serde_json = "1.0"
sqlx = { version = "=0.8.6", features = ["postgres", "runtime-tokio", "macros", "json", "time"] }
tokio = { version = "1.53", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
