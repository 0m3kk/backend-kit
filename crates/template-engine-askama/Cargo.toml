[package]
name = "template-engine-askama"
version = "1.0.0"
edition = "2024"
description = "Askama (compile-time HTML templates) implementation of TemplateEngine for backend-kit."

[dependencies]
askama = "0.16"
serde = { version = "1.0", features = ["derive"] }
