[package]
name = "tx-manager"
version = "0.1.0"
edition = "2024"
description = "Transaction Manager and Runner abstractions for backend-kit"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"

event-sourcing = { path = "../event-sourcing" }
event-store-postgres = { path = "../event-store-postgres" }
kv-store = { path = "../kv-store" }
kv-store-postgres = { path = "../kv-store-postgres" }
secret-store = { path = "../secret-store" }
secret-store-postgres = { path = "../secret-store-postgres" }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-native-tls", "macros"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["time", "sync"] }
tracing = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
