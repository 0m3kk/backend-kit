[package]
name = "oidc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OpenID Connect (OIDC) authentication service, configuration, and helpers"
readme = "README.md"

[dependencies]
base64 = "0.23"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
url = { version = "2", features = ["serde"] }
utoipa = "6"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
