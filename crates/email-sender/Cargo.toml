[package]
name = "email-sender"
version = "0.1.0"
edition = "2024"
description = "Core traits, models, errors, and builder for email sending in backend-kit."

[features]
memory = ["dep:tokio"]

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["sync"], optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "memory_sender_tests"
required-features = ["memory"]

[lints]
workspace = true
