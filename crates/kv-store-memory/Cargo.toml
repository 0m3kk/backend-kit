[package]
name = "kv-store-memory"
version = "0.0.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
kv-store = { path = "../kv-store" }
tokio = { version = "1.53", features = ["sync", "time"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
